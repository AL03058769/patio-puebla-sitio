    </g>
    <!-- rosetas de orilla, partidas para repetir sin costura -->
    <g transform="translate(0 60)">
      <ellipse rx="7" ry="20"/>
      <ellipse rx="7" ry="20" transform="rotate(45)"/>
      <ellipse rx="7" ry="20" transform="rotate(90)"/>
      <ellipse rx="7" ry="20" transform="rotate(135)"/>
