      <circle r="3.2"/>
    </g>
    <g transform="translate(240 60)">
      <ellipse rx="7" ry="20"/>
      <ellipse rx="7" ry="20" transform="rotate(45)"/>
      <ellipse rx="7" ry="20" transform="rotate(90)"/>
      <ellipse rx="7" ry="20" transform="rotate(135)"/>
      <circle r="7.4" fill="#1B4A86"/>
      <circle r="3.2"/>
    </g>
    <!-- flor pequeña entre rosetas -->
