<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <rect width="240" height="120" fill="#1B4A86"/>
  <g stroke="#F7F0DF" stroke-opacity=".62" stroke-width="1.1" fill="none">
