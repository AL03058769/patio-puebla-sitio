        <ellipse rx="4.6" ry="14" transform="rotate(67.5)"/>
        <ellipse rx="4.6" ry="14" transform="rotate(112.5)"/>
        <ellipse rx="4.6" ry="14" transform="rotate(157.5)"/>
      </g>
      <circle r="8.8" fill="#1B4A86"/>
